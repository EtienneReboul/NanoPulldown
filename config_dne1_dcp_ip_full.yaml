# Run overlay: FULL-LENGTH DNE1/DCP1/DCP2 IP screen on an H200 cluster (IFB,
# CAIUS) -- the complement of config_dne1_dcp_ip_fragments.yaml: same 5 baits x
# 112 preys (AT3G49490 excluded), whole proteins, 5 seeds x 1 sample
# (config.local.yaml from config.ifb.yaml.example / config.caius.yaml.example).
# Both GYF baits are ~1490 aa, so pairs run to ~4000 tokens. max_tokens 2880:
# the H200 (141 GB) limit at 1 sample by the Mac's n^2.2 memory fit -- 553 of
# 585 pairs (IFB H200 measured 60 GiB peak at 1,820 tokens; 2400 was the first
# IFB expansion, 509 pairs). ~5.8 h per pair at 2880 tokens (IFB H200 fit).
# Controls: positives only -- decoys (n x 5 baits) don't fit the project's
# inode quota (2026-10-20).
#   NANOPULLDOWN_RUN_CONFIG=config_dne1_dcp_ip_full.yaml nanopulldown inputs expand
#   NANOPULLDOWN_RUN_CONFIG=config_dne1_dcp_ip_full.yaml snakemake --profile profiles/<ifb|caius>

run_name: "dne1_dcp_ip_full"

esmfold2:
  max_tokens: 2880
  pairs_per_load: 30          # one H200 job per 30 pairs (model loaded once)

hpc:
  gpu_classes:                # every fold job on an H200 (IFB gpu-node-4; CAIUS hpc-n977-981)
    - {gpu_model: "h200", max_tokens: 0, mem_mb: 160000, cpus: 8}

fragments:
  enabled: false

controls:
  decoys:
    enabled: false

dirs:
  annotation:  "data/annotation_dne1_dcp_ip_full"
  postproc:    "results_dne1_dcp_ip_full"
  reports:     "reports_dne1_dcp_ip_full"
  logs:        "logs_dne1_dcp_ip_full"

inputs:
  baits:
    - list: configs/baits_dne1_dcp_ip.txt
  preys:
    - list: configs/preys_dne1_dcp_ip.txt
    - exclude: [Q9SCK9]   # AT3G49490: PLIP segfaults (exit 139) in --chains mode (fragment run, 2026-10-18)

pairs_file: configs/pairs_dne1_dcp_ip_full.txt
