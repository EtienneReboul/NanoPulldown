# Snakemake profile for the IFB Core Cluster (SLURM). From the checkout on the
# login node, with config.local.yaml copied from config.ifb.yaml.example and
# the envs built by scripts/ifb/setup.sh:
#
#   export PATH=/shared/projects/npf_abinitio/conda/envs/abcfold-npf-pipeline/bin:$PATH:/shared/software/miniconda_deployment/bin
#   export CONDA_CHANNEL_PRIORITY=strict
#   NANOPULLDOWN_RUN_CONFIG=config_<run>.yaml snakemake --profile profiles/ifb
#
# Fold jobs (run_esmfold2_chunk_NNN, one per esmfold2.pairs_per_load pairs)
# take their GPU model / partition / memory / walltime from config.yaml's
# `hpc:` block (the Snakefile's fold_resources()): chunk rule names are only
# known at parse time, so they can't be listed under set-resources here.
# Everything else is a CPU job on `fast`, sized below.
executor: slurm
software-deployment-method: conda   # the same envs/*.yaml as on the Mac, prebuilt by scripts/ifb/setup.sh
jobs: 100                    # max SLURM jobs queued/running at once
latency-wait: 90             # CephFS lag before a job's outputs are visible
retries: 1
keep-going: true
rerun-incomplete: true
printshellcmds: true

# Global caps the scheduler enforces (as --resources): GPU jobs submitted at
# once -- fold jobs plus the short minimize_cif ones, which share the `gpu`
# resource (the SLURM plugin maps it to --gpus). Keep it above the number of fold
# chunks: queued-but-waiting fold jobs hold slots, and at 12 they blocked every
# minimize job behind 12 of DNE1's 17 H200 chunks. SLURM itself limits what runs. docker_heavy is deliberately left out = uncapped -- on the
# Mac it keeps PLIP/minimize off the GPU's memory; here each job has its own.
resources:
  - gpu=25

default-resources:
  slurm_account: "npf_abinitio"
  slurm_partition: "fast"
  mem_mb: 4000
  runtime: 60                # minutes
  cpus_per_task: 1

set-resources:
  annotate_domains_batch:    # throttled InterPro / ScanProsite web calls
    runtime: 720
    cpus_per_task: 2
  annotate_disorder_batch:   # AIUPred, CPU
    runtime: 240
    mem_mb: 16000
    cpus_per_task: 8
  minimize_cif:              # OpenMM on a GPU node's OpenCL: seconds per sample, vs ~22 min on
    slurm_partition: "gpu"   # CPU (2026-10-20 test; CUDA fails there: PTX newer than the driver)
    gpu: 1
    gpu_model: "l40s"        # leaves the H200s to the fold jobs
    slurm_extra: "--exclude=gpu-node-7,gpu-node-9"
    runtime: 30
    mem_mb: 8000
    cpus_per_task: 2
  run_plip:
    runtime: 60
    mem_mb: 8000
  collect_results_table:
    mem_mb: 16000
  fig_metric_violins_interactive:
    mem_mb: 16000
  bait_tables:
    mem_mb: 8000
  datavzrd_bait:
    mem_mb: 8000
  datavzrd_folding:
    mem_mb: 8000

# Not grouped (yet): with 5 samples a pair is ~20 short CPU jobs (minimize,
# PLIP, parse x 5, ...), each its own SLURM job, throttled by `jobs:`. Snakemake
# `groups` + `group-components` could bundle them, but it sizes a group job by
# SUMMING its parallel members (10 pairs x 5 minimizations ~ 400 GB / 200 CPUs),
# so it needs tuning against a real run before it is turned on.
