name: "nanopulldown results"

default-view: results

datasets:
  results:
    path: "results_table.csv"
    separator: ","
  minimize_failures:
    path: "minimize_failure_rate.csv"
    separator: ","
  clash_stats:
    path: "clash_test_stats.csv"
    separator: ","
  clash_counts:
    path: "clash_counts.csv"
    separator: ","

views:
  results:
    dataset: results
    desc: |
      Per bait/prey pair, per ESMFold2-Fast diffusion sample, per bait-prey
      chain pair: AlphaPulldown-style confidence and interaction scores.
      `pair_iptm` is ESMFold2's own per-chain-pair ipTM; `ipsae`/`ilis`/
      `pinc`/`pdockq`/`pdockq2` are ab_initio_pipeline's PAE-based rescoring
      stack (ipSAE, LIS-family, Pinc), computed identically here.
    render-table:
      columns:
        pair:
          label: "pair"
        sample_index:
          label: "sample"
        chain_i:
          label: "chain i"
        chain_j:
          label: "chain j"
        ptm:
          label: "pTM"
        iptm:
          label: "ipTM"
        pair_iptm:
          label: "pair ipTM"
        mean_plddt:
          label: "mean pLDDT"
        ipsae:
          label: "ipSAE"
        ilis:
          label: "iLIS"
        pinc:
          label: "Pinc"
        pdockq:
          label: "pDockQ"
        pdockq2:
          label: "pDockQ2"
        note:
          label: "note"

  minimize_failures:
    dataset: minimize_failures
    desc: |
      OpenMM minimization outcome per pair: how many of the
      `esmfold2.num_diffusion_samples` diffusion samples minimized cleanly
      vs. diverged (energy -> NaN or past `minimize.max_abs_energy`).
    render-table:
      columns:
        pair:
          label: "pair"
        num_samples:
          label: "samples"
        num_succeeded:
          label: "succeeded"
        num_failed:
          label: "failed"
        failure_rate:
          label: "failure rate"

  clash_stats:
    dataset: clash_stats
    desc: |
      Paired Wilcoxon signed-rank test, raw vs OpenMM-minimized structures
      (H1: raw > minimized by default). `rank_biserial` is the matched-pairs
      effect size.
    render-table:
      columns:
        metric:
          label: "metric"
        alternative:
          label: "H1"
        n_pairs:
          label: "n units"
        n_nonzero:
          label: "n non-zero diffs"
        median_raw:
          label: "median raw"
        median_minimized:
          label: "median minimized"
        median_diff:
          label: "median diff"
        n_improved:
          label: "improved"
        n_worse:
          label: "worse"
        statistic:
          label: "W"
        p_value:
          label: "p-value"
        rank_biserial:
          label: "rank-biserial"

  clash_counts:
    dataset: clash_counts
    desc: |
      Clash counts per (pair, sample) unit with both a raw and a minimized
      structure; `metric` is `n_clashes` (all) or `n_clashes_interchain`.
    render-table:
      columns:
        metric:
          label: "metric"
        pair:
          label: "pair"
        sample:
          label: "sample"
        raw:
          label: "raw"
        minimized:
          label: "minimized"
