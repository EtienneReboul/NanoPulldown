  query_dir: "data/uniprot_retrieval"   # <dir>/<name>.tsv + .json: uniprot_query snapshots
  retries: 3
  timeout_s: 30

# PPI database access (nanopulldown.services.interactors): known partners of the
# baits from the databases UniProt cross-references, for the positive controls
# and the decoy exclusions (`controls:` below).
interactors:
  snapshot_dir: "data/interactors"      # <dir>/<name>.tsv + .json: one snapshot per run (interactors_<run>)
  ols_url: "https://www.ebi.ac.uk/ols4/api"   # PSI-MI term descendants (direct evidence), cached in snapshot_dir
  retries: 3
  timeout_s: 60
  psicquic_page: 500
  string:                               # defaults; a source's own `string:` overrides
    base_url: "https://string-db.org/api"
    network_type: "physical"            # physical | functional
    min_score: 400                      # STRING combined score, 0-1000 (400 = medium)
    limit: 100                          # max partners per query protein
  complexportal_url: "https://www.ebi.ac.uk/intact/complex-ws"
  psicquic:                             # PSICQUIC REST endpoints, usable as `databases:` names
    intact:  "https://www.ebi.ac.uk/Tools/webservices/psicquic/intact/webservices/current"
    mint:    "https://www.ebi.ac.uk/Tools/webservices/psicquic/mint/webservices/current"
    imex:    "https://www.ebi.ac.uk/Tools/webservices/psicquic/imex/webservices/current"
    biogrid: "http://tyersrest.tyerslab.com:8805/psicquic/webservices/current"

# ── Stage 1a: controls (nanopulldown.inputs.controls, nanopulldown.inputs.decoys) ──────
# Added to every run's preys by nanopulldown.inputs.expand and paired with every
# bait: the baits' known direct partners (positives, tag `known`) and a decoy
# set matched to the screen's preys (negatives, tag `decoy`). The Snakefile's
# decoy_calibration rule turns them into per-bait conformal p-values / BH hits
# and a positive-control recall. Turn either off in a run overlay.
controls:
  positives:
    enabled: true
    name: known                    # input-source tag (prey_sources), column prefix known_*
    databases: [uniprot, intact, mint, biogrid, string, complexportal]
    # Evidence tier of each (bait, partner), best first (nanopulldown.services.interactors):
    #   curated  listed under `curated:` below
    #   high     direct evidence in >= high_min_publications papers, or direct + MIscore
    #            >= high_miscore, or a structure_methods row
    #   medium   direct evidence in >= min_direct_publications papers
    #   low      reported, nothing direct (co-IP, AP-MS, FRET/BiFC alone, complexes, STRING)
    min_tier: high                 # positives = partners at least this tier; low = every reported partner
    direct_types: ["MI:0407"]      # PSI-MI interaction types counted as direct (+ descendants:
                                   # covalent binding, enzymatic reactions such as ubiquitination) ...
    proximity_methods: ["MI:0055", "MI:0012", "MI:0809"]   # ... unless seen by FRET, BRET, BiFC
    direct_methods: ["MI:0018"]    # detection methods counted as direct (+ descendants): two hybrid.
                                   # Add "MI:0090" (protein complementation: BiFC, split luciferase)
                                   # to also accept proximity assays
    min_direct_publications: 1     # distinct PubMed ids with direct evidence (medium)
    high_min_publications: 2       # ... (high)
    high_miscore: 0.6              # MIscore (IntAct's, recomputed over every database) for high
    structure_methods: ["MI:0114", "MI:0077"]   # X-ray, NMR (+ descendants): high
    curated:                       # hand-picked positives, tier `curated`: {bait: [{partner, pmids, note}]}
      A1L4W5:                      # BPM6
        - {partner: Q9ZVH4, pmids: [15772280],
           note: "CUL3A: BTB-CUL3 binding of the CRL3 ligase; databases: one pull-down, physical association"}
    min_databases: 1
    same_organism: true
    max_partners: null             # keep the N best-supported (null = all)
    # string: {min_score: 700}     # overrides interactors.string (STRING only annotates: its experiments
                                   # channel is BioGRID / IntAct again, never a tier)
  decoys:                          # knobs: nanopulldown.inputs.decoys DEFAULTS
    enabled: true
    name: decoy
    n: 500                         # decoy preys per run, each paired with every bait (fragment):
                                   # n x bait fragments extra folds. Smallest p = 1/(n+1)
    seed: 0
    length_bins: 8
    cys_his_cutoff: 0.08
    max_per_protein: 2
    exclude_transmembrane: false
    exclude_interactors: true      # never draw a known partner of the baits (any evidence)

# ── Stage 1b: sequence annotation (domains / disorder / MoRF) ──────────────
# Annotation is cached per unique sequence (data/annotation/_cache/); a proposed
# `domains:` block per pair is left at data/annotation/<pair>/annotation.yaml for
# HUMAN REVIEW. Curated blocks go in configs/curated_domains.yaml, which report
# figures prefer over the proposal once `annotation_reviewed: true`.
annotate:
  web_workers: 4                # thread pool for the ScanProsite/InterPro batch
  # Neither InterPro nor ScanProsite publishes a numeric limit. InterPro asks users to
  # "start querying gradually, then ramp up" (tens of thousands of requests in a short
  # period have taken the API down for everyone). All requests share these limiters, so
  # web_workers only sets concurrency, never the request rate.
  rate_limits:
    interpro_per_s: 1.0         # InterPro API: 1 request/s (3600/h; 1559 proteins ~ 26 min)
    scanprosite_per_s: 0.5      # ScanProsite (ExPASy): 1 request / 2 s
    ramp_s: 120                 # start at 10% of the rate, reach 100% linearly over this many seconds
    max_throttle_events: 10     # 429/502/503/504 responses before the batch aborts (progress is cached)
  prosite:
    scan_url: "https://prosite.expasy.org/cgi-bin/prosite/PSScan.cgi"
    skip_profiles: false        # false = include PROSITE profiles (PS50xxx), not just patterns
  interproscan:
    # InterProScan v6 MATCH API: submit MD5(sequence) first; a global cache
    # hit (very likely for any previously-analysed UniProt sequence) returns
    # matches immediately with no wait. Falls back to full submission (same
    # submit/poll shape as v5) only on a cache miss.
    # Fast path (default for every full-length UniProt chain): precomputed InterPro
    # matches by accession, ONE request each (~2 s; no multi-accession form exists --
    # batching = the web_workers thread pool). Fragments / isoforms / length
    # mismatches fall back to the MATCH/submit path below.
    api_url: "https://www.ebi.ac.uk/interpro/api"
    email: ""                       # only for the InterProScan submission fallback (set in config.local.yaml)
    base_url: "https://www.ebi.ac.uk/Tools/services/rest/iprscan6"
    match_endpoint: "matches"       # POST {base_url}/{match_endpoint} with md5 list -- confirm against current EBI docs
    poll_s: 15
    applications: ["PfamA", "SMART", "PrositeProfiles", "Gene3d", "MobiDBLite"]
  aiupred:
    # Disorder AND MoRF/binding-propensity in one step, via AIUPred's docker
    # image (replaces metapredict/IUPred3/ANCHOR2 and MoRFchibi2). Mac has no
    # CUDA, so :cpu is what actually runs here; :gpu is for a future CUDA host.
    image_cpu: "ghcr.io/doszilab/aiupred:cpu"
    image_gpu: "ghcr.io/doszilab/aiupred:gpu"
    use_gpu: false
    docker_platform: ""            # e.g. "linux/amd64" on Apple Silicon if the image has no arm64 build
    batch_size: 200                # sequences per container invocation in the batch rule
  morfchibi:
    score_threshold: 0.725         # AIUPred binding-mode probability cutoff for calling a MoRF residue
    min_len: 5                     # minimum contiguous MoRF segment length (residues)
  consensus:
    disorder_cutoff: 0.5

# ── Stage 1a: fragment mode (nanopulldown.inputs.fragments) ──────────────────
# Cut baits and preys into their annotated domains before pairing, and fold
# bait domain x prey domain instead of full length x full length -- the way
# yeast two-hybrid constructs are made. Each fragment is an ordinary region
# spec (Q9M548:285-626), so everything downstream runs unchanged; proteins too
# long for esmfold2.max_tokens at full length can be screened by domain.
# Domains are the ones the reports show (InterPro representative set,
# nanopulldown.annotate.merge); configs/fragment_domains.yaml overrides them
# per accession. Preview: nanopulldown inputs fragments <ACC> [<ACC> ...]
# Turn on in a run overlay (see config_drm2_fragments.yaml), then rerun
# nanopulldown.inputs.expand.
fragments:
  enabled: false
  sides: [bait, prey]            # which side(s) get cut; the other stays full length
  merge_gap: 0                   # domains at most this many residues apart -> one fragment; 0 = only
                                 # abutting/overlapping ones (one unit split across two signatures,
                                 # e.g. BTB/POZ + BACK), so MATH and BTB stay separate fragments
  repeat_gap: 20                 # repeats of the SAME domain this close -> one fragment (WD40, UBA ...)
  min_length: 15                 # drop merged domain blocks shorter than this (before padding); keep
                                 # it low -- short motifs (JAZ1's 26-aa Jas) are often the binder
  padding: 10                    # residues added on each side of a block (clipped to the protein)
  without_domains: full_length   # full_length: keep a protein with no domain whole | skip: drop it
  include_full_length: false     # also pair each fragmented protein whole (full-length control)
  overrides: configs/fragment_domains.yaml   # {accession: [{name, start, end}]}, hand-curated

# ── Stage 2a: fold engine ───────────────────────────────────────────────────
# esmfold2 (default): ESMFold2-Fast, no MSA -- Mac (MLX) or CUDA (`esmfold2:`).
# colabfold: ColabFold / AlphaFold2-multimer with MMseqs2 MSAs -- CUDA only
# (IFB / CAIUS; `colabfold:` below). Both write the same results/<pair>/raw/
# (sample_<i>.cif.gz + fold.parquet), so everything downstream is shared. Switch
# it in a run overlay WITH that run's own `dirs:`: a pair folded by one engine
# looks finished to the other.
fold:
  engine: "esmfold2"              # esmfold2 | colabfold

# ── Stage 2a: ESMFold2-Fast folding ─────────────────────────────────────────
esmfold2:
  backend: "mlx"                  # mlx (Apple Silicon, mlx-lm) | torch (CUDA -- the IFB cluster; envs/esmfold2_cuda.yaml)
  checkpoint: "biohub/ESMFold2-Fast"
  hf_home: ""                     # HF_HOME for the fold jobs ("" = the default ~/.cache/huggingface); on IFB a
                                   # pre-downloaded cache in project storage, so GPU nodes need no internet
  stage_weights: false            # copy the weights to the node-local $TMPDIR before loading (IFB: CephFS
                                   # -> NVMe; see config.ifb.yaml.example)
  conda_lib_first: false          # fold jobs: the env's lib/ first on LD_LIBRARY_PATH (CAIUS: RHEL 8's
                                   # libstdc++ is older than the env's numpy needs)
  lm_dropout: 0.0                 # ESM LM-embedding dropout per loop. MLX never applies it (so every Mac fold is
                                   # 0.0); esm's torch fold() defaults to 0.3, so it is passed explicitly to keep
                                   # CUDA folds comparable with the Mac ones
  num_loops: 10
  num_sampling_steps: 100
  num_diffusion_samples: 1        # ONE sample per run: peak GPU memory scales with samples (~4 GiB per
                                   # sample at 600 tokens) but NOT with num_loops / num_sampling_steps, so
                                   # one sample lets longer complexes fit and folds faster. Measured on a
                                   # 36 GB M4 Max (notebooks/esmfold2_memory_model.ipynb).
  max_tokens: 1050               # pairs with more total tokens (sum of chain lengths) than this are not
                                   # run: expand_pairs.py doesn't write them and the Snakefile ignores
                                   # them. 0 = no limit. Measured on a 36 GB M4 Max, 1 sample, loops 10 /
                                   # steps 100: 945 tokens fine; 1000 tokens = 16.9 GiB above the 12.2 GiB
                                   # weights (29.1 GiB total, 145 s, ~3 GB extra swap with other apps open);
                                   # 1200 ~ 24 GiB = the whole machine. Peak grows ~n^2.2. Lower it if you
                                   # keep memory-heavy apps open; set per machine in config.local.yaml
                                   # after running notebooks/esmfold2_memory_model.ipynb.
  pairs_per_load: 50              # fold this many pairs per model load (one job per chunk; the model is loaded
                                   # once, not once per pair -- avoids a ~25 GB transient load + swap spike per
                                   # fold). 0 = one process per pair. Downstream steps of a chunk wait for the
                                   # whole chunk, so ~1-2 h per chunk is a good size.
  seed: 1
  num_seeds: 1                    # separate fold runs per pair (seeds seed .. seed+num_seeds-1), each giving
                                   # num_diffusion_samples samples; samples per pair = the product. Runs, not
                                   # samples, are what lm_dropout diversifies (one run's samples share a trunk),
                                   # and memory stays that of one run. IFB: 5 runs x 1 sample, lm_dropout 0.3.

# ── Stage 2a: ColabFold folding (fold.engine: colabfold) ─────────────────────
# Two rules: colabfold_msa (ONE batch: a paired + unpaired MSA per complex,
# cached by content in msa.cache_dir, so only new complexes are searched), then
# run_colabfold_chunk_NNN (colabfold_batch over pairs_per_load pairs' MSAs per
# GPU job; nanopulldown.fold.colabfold). Samples per pair = num_models x num_seeds.
colabfold:
  model_type: "alphafold2_multimer_v3"
  num_models: 5                   # AF2-multimer models 1..num_models per seed
  num_seeds: 1                    # seeds random_seed .. random_seed+num_seeds-1
  random_seed: 0
  num_recycle: null               # null = ColabFold's default (multimer_v3: up to 20, early stop)
  recycle_early_stop_tolerance: null
  use_dropout: false
  calc_extra_ptm: true            # per-chain-pair ipTM (pair_iptm in interface_metrics) + actifpTM
  max_tokens: 2500                # pairs above it are not expanded/folded (like esmfold2.max_tokens);
                                  # AF2-multimer fits ~2,500 tokens in 48 GB, ~3,500 in 80 GB (unmeasured here)
  pairs_per_load: 20              # pairs per colabfold_batch call (= per GPU job); 0 = one per job
  data_dir: ""                    # AF2 weights dir (`--data`; holds params/): pre-downloaded on offline
                                  # GPU nodes (scripts/colabfold/setup.sh weights); "" = ColabFold's cache
  conda_lib_first: false          # as esmfold2.conda_lib_first (CAIUS: RHEL 8's libstdc++)
  keep_raw_outputs: false         # keep ColabFold's PDB/JSON in results/_colabfold/ after conversion
  extra_args: []                  # appended to colabfold_batch, e.g. ["--max-msa", "512:1024"]
  time_fit: {}                    # {base_s, coef_s, exponent}: ONE model's time, t = base_s + coef_s *
                                  # (n/600)^exponent; {} = a rough AF2-multimer guess -- refit after a run
  runtime_safety: 3.0             # walltime = estimate x this (hpc.fold_runtime_safety is ESMFold2's)
  gpu_classes: []                 # [] = hpc.gpu_classes; else the same form, for AF2's own memory needs
  msa:
    mode: "server"                # server: ColabFold's MMseqs2 web API (internet; small runs only) |
                                  # local: colabfold_search on local databases (MMseqs2-GPU with gpu: 1)
    cache_dir: "data/msa"         # <key>.a3m per complex (key = sequences + the settings below)
    msa_mode: "mmseqs2_uniref_env"   # server: colabfold_batch --msa-mode
    pair_mode: "unpaired_paired"
    server_max_queries: 500       # server mode refuses more new complexes than this: the public
                                  # server is shared -- use local mode for a large screen
    host_url: ""                  # "" = the public api.colabfold.com; or a private MSA server
    # local mode (colabfold_search; databases from ColabFold's setup_databases.sh,
    # GPU=1 for the padded GPU databases -- ~1 TB, scripts/colabfold/setup.sh databases)
    db_dir: ""
    db1: "uniref30_2302_db"
    db3: "colabfold_envdb_202108_db"
    use_env: 1
    mmseqs: "mmseqs"              # MMseqs2 >= 16 built with GPU support for gpu: 1
    gpu: 1                        # 1: MMseqs2-GPU (one GPU job); 0: CPU search (a big-memory CPU job)
    gpu_server: 1                 # keep the databases resident in GPU memory across queries
    db_load_mode: 2               # 2 = mmap (with gpu_server, per ColabFold's README)
    threads: 0                    # 0 = the job's CPUs
    extra_args: []                # appended to colabfold_search / colabfold_batch --msa-only
    slurm: {partition: "", gpu_model: "", mem_mb: 128000, cpus: 16, runtime: 720}
                                  # the local search job (partition "" = hpc.gpu_partition)

# ── Stage 2b: interface metrics (PAE-based, over all 5 diffusion samples) ──
metrics:
  enabled: ["ipsae", "ilis", "pinc"]   # tools/ipsae, pure-python LIS family, tools/pinc
  pae_cutoff: 12.0             # Angstrom -- LIS / ipSAE interaction-region PAE ceiling
  contact_cutoff_cb: 8.0       # Angstrom -- Cb-Cb direct-contact cutoff (cLIS / iLIS)
  pairs: "bait_prey"           # "bait_prey" (each bait chain x each prey chain) | "all"

# ── Stage 2c: OpenMM minimization (no ChimeraX, no antechamber) ────────────
minimize:
  forcefield: ["amber14-all.xml", "implicit/gbn2.xml"]
  platform_preference: ["OpenCL", "CPU"]   # OpenCL for Mac Metal-backed GPU accel; CPU fallback
  max_abs_energy: 1.0e15       # |energy| kJ/mol above this = diverged, stop and flag
  divergence_factor: 100.0     # energy rising by more than this x its running min = diverged
  probe_steps: 200
  max_steps: 2000
  trace_interval: 50           # record energy every N iterations (-> sample_<i>_energy.parquet)
  convergence_delta: 1.0e-3    # kJ/mol: stop early if a chunk changes energy by less than this
  # ChimeraX `clashes` defaults, used by nanopulldown.structure.clashes to compare
  # raw vs minimized structures (heavy atoms only -- see that script).
  clashes:
    overlap_cutoff: 0.6        # A: vdW overlap (after allowance) at/above which a pair clashes
    hbond_allowance: 0.4       # A: subtracted for N/O--N/O pairs
    bond_separation: 4         # ignore pairs <= this many bonds apart
    alternative: "greater"     # Wilcoxon H1 on (raw - minimized); "two-sided" to be agnostic

# ── Stage 2d: PLIP contact analysis (docker + pliparser) ────────────────────
# Once per minimized sample: PLIP (docker) identifies bait<->prey contacts,
# treating bait_chains as one interaction partner and prey_chains as the
# other (--chains); pliparser (rule plip_parse) turns its TXT report into a
# ChimeraX .cxc and a contact table, and all of a pair's samples are merged
# into results/<pair>/plip_contacts.parquet.
plip:
  image: "docker.io/pharmai/plip:latest"
  docker_memory: "8g"
  docker_platform: "linux/amd64"   # pharmai/plip has no arm64 build -- required on Apple Silicon
  max_chain_len: 700             # PLIP 3.0 segfaults (exit 139) on long chains: longer chains are given
                                 # extra chain ids for PLIP only, mapped back in the report
                                 # (nanopulldown.plip.chain_split). Contacts are identical (tested 2026-10-19).
                                 # 850 was not enough: A1L4W5__F4K4Y5 (415 + 778 aa) crashed at 850 and
                                 # passed split at 700 (2026-10-20); dne1 crashed from ~880 aa.
  # ChimeraX visualization script (rule plip_parse, pliparser csv2cxc)
  cxc:
    bait_color: "gray"
    prey_color: "cornflowerblue"
    transparency: 65

# minimize_cif and run_plip each claim 1, so once folding for a pair is
# done, up to N of them run concurrently (mixed, not per-rule limits).
# Launch with `--resources docker_heavy=<this value>` for it to take
# effect (see README) -- omitting the flag leaves the pool uncapped.
# minimize_cif also tries OpenCL (the same Metal GPU run_esmfold2 uses) per
# `minimize.platform_preference` above, so N concurrent minimizations means
# N concurrent OpenCL contexts on one GPU -- untested at N>1 on this Mac;
# lower this if that turns out to contend.
scheduling:
  docker_heavy_pool: 3

# ── Execution: tool images and the SLURM cluster (IFB) ──────────────────────
# Rule envs are conda envs (envs/*.yaml, --use-conda) on the Mac and on IFB.
# Only the two third-party tools that ship as images, PLIP and AIUPred, go
# through a container runtime: docker on the Mac, apptainer on IFB (no docker
# daemon there). config.local.yaml on IFB (from config.ifb.yaml.example)
# switches it -- see README "Running on the IFB cluster".
execution:
  container_runtime: "docker"     # docker | apptainer (<images_dir>/plip.sif, aiupred.sif)
  images_dir: ""                  # apptainer only: where scripts/ifb/setup.sh pulls the .sif images
  apptainer_args: "--bind /shared"

# SLURM resources (snakemake-executor-plugin-slurm), used only when run with
# --profile profiles/ifb. CPU rules take theirs from the profile; the fold
# chunks are named per chunk (run_esmfold2_chunk_000, ...), so theirs are
# set here: the first gpu_classes entry whose max_tokens covers the chunk's
# largest pair (0 = any size).
hpc:
  gpu_partition: "gpu"
  exclude_nodes: "gpu-node-7,gpu-node-9"   # IFB nodes with known infra issues
  gpu_classes:
    - {gpu_model: "l40s", max_tokens: 1200, mem_mb: 128000, cpus: 8}    # 48 GB; 5 nodes x 4 GPUs. 64 GB host RAM
                                                                       # made a cold import 494 s (page-cache thrash)
    - {gpu_model: "h200", max_tokens: 0, mem_mb: 160000, cpus: 8}       # 141 GB; gpu-node-4 only
  # fold job walltime: model load + per-pair estimate (the Mac fit in
  # notebooks/esmfold2_memory_model.ipynb's terms, scaled by loops/steps/samples),
  # times this safety factor, capped at the gpu partition's 3 days
  fold_runtime_safety: 3.0
  fold_runtime_min: 60            # minutes
  fold_runtime_max: 4320          # minutes: the gpu partition's walltime limit (CAIUS publicgpu: 1440)
  fold_load_minutes: 10           # model load allowance per fold job
  fold_chunk_minutes: 0           # > 0: also cap a chunk's estimate (pairs_per_load still applies)
  fold_time_fit: {}               # {base_s, coef_s, exponent}: per-fold time at 10 loops / 100 steps /
                                  # 1 sample, t = base_s + coef_s * (n/600)^exponent; {} = the Mac fit
  gpu_request: "gpus"             # "gres": --gres=gpu:1 instead of --gpus (SLURM without cons_tres, CAIUS)
  gpu_constraints: {}             # untyped GPU gres: {gpu_model: node feature}, e.g. {h200: gpuh200}

# ── Stage 2e: reports ────────────────────────────────────────────────────────
report:
  figure_formats: ["svg", "pdf"]   # NEVER png/jpeg
  figure_theme: "dark"              # dark (matches the report's dark stylesheet) | light (print / slides)
  figure_transparent: false         # true: no figure background -- sits directly on the report page
  datavzrd: true                    # tabular report items rendered via the datavzrd wrapper

# ── Output directories ──────────────────────────────────────────────────────
dirs:
  sequences:   "data/sequences"
  annotation:  "data/annotation"
  postproc:    "results"        # per-pair results live at results/<pair>/
  reports:     "reports"
  logs:        "logs"
