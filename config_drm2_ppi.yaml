# Run overlay: bait DRM2 (Q9M548, DNA (cytosine-5)-methyltransferase, AT5G14620)
# x its known interactors in the PPI databases UniProt cross-references
# (UniProt, IntAct, MINT, BioGRID, STRING physical, Complex Portal; see
# nanopulldown.services.interactors). No screen preys: the run is the positive
# controls alone, with every reported partner (direct or not), as the former
# `interactors:` input source selected them, and no decoys. Snapshot:
# data/interactors/interactors_drm2_ppi.tsv (pairs folded 2026-10 came from
# the old data/interactors/drm2_ppi.tsv; tag `drm2_ppi` there, `known` now).
# Usage (overlay after config.yaml / config.local.yaml):
#   nanopulldown --run-config config_drm2_ppi.yaml inputs expand
#   NANOPULLDOWN_RUN_CONFIG=config_drm2_ppi.yaml snakemake --use-conda --cores 4 \
#       --resources gpu=1 docker_heavy=2
# Outputs go to *_drm2_ppi dirs (annotation too, so this run never rewrites the
# shared annotation cache's .done markers of the main run).

run_name: "drm2_ppi"

esmfold2:
  max_tokens: 1200   # as q9m548_e3_fbox (same bait); AGO4/AGO9/TPR2/CYP65 still exceed it,
                     # see configs/skipped_too_long_drm2_ppi.tsv

dirs:
  annotation:  "data/annotation_drm2_ppi"
  postproc:    "results_drm2_ppi"
  reports:     "reports_drm2_ppi"
  logs:        "logs_drm2_ppi"

inputs:
  baits:
    - accessions: [Q9M548]

controls:
  positives:
    min_tier: low               # every partner of the bait, >= 1 database
    min_databases: 1
  decoys:
    enabled: false

pairs_file: configs/pairs_drm2_ppi.txt
