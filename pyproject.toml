[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nanopulldown"
version = "0.2.0"
description = "AlphaPulldown-style bait x prey screening with ESMFold2-Fast on Apple Silicon"
requires-python = ">=3.11"
# core + CLI: stdlib + pyyaml (pyarrow for the pair tables). Each stage's
# heavier deps live in its conda env (envs/*.yaml); the extras only document them.
dependencies = ["pyyaml>=6.0", "pyarrow>=15.0"]

[project.optional-dependencies]
analysis = ["numpy>=1.26", "pandas>=2.0", "scipy>=1.11", "gemmi>=0.7", "matplotlib>=3.8",
            "plotly>=5.18", "requests>=2.31"]
minimize = ["openmm>=8.1", "pdbfixer>=1.9", "numpy>=1.26", "pandas>=2.0"]
fold = ["numpy>=1.26", "esm", "mlx>=0.30"]
plip = ["python-pliparser==1.0.0"]

[project.scripts]
nanopulldown = "nanopulldown.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"nanopulldown.report" = ["assets/*.css"]

[tool.ruff]
line-length = 120
src = ["src"]
extend-exclude = ["src/nanopulldown/structure/vendor"]

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501", "E731", "E741"]

[tool.ruff.lint.isort]
known-first-party = ["nanopulldown"]
