name: nanopulldown-esmfold2-cuda
# Stage 2a folding on CUDA (esmfold2.backend: torch) -- the IFB cluster's
# L40S / H200 GPUs. Same `esm` as envs/esmfold2.yaml (the featurizer/builder
# AND, here, the model itself: esm.models.esmfold2.EsmFold2Model), no mlx.
# torch comes from the cu128 wheel index: CUDA 12.8 runtime inside the wheel,
# so only the GPU node's driver is needed, no CUDA module. Built by --use-conda
# like every rule env (on IFB once, by scripts/ifb/setup.sh: ~74k files).
channels:
  - conda-forge
  - nodefaults
dependencies:
  - python=3.12
  - pyyaml>=6.0
  - numpy>=1.26
  - pyarrow>=15.0   # raw/fold.parquet (nanopulldown.core.fold_table)
  - pip
  - pip:
      - --extra-index-url https://download.pytorch.org/whl/cu128
      - torch==2.11.0+cu128   # explicit local version, so pip can't pick PyPI's build (other CUDA)
      - esm==3.4.1.post1   # the version the Mac's MLX runs used
