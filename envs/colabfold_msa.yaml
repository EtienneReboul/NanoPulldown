name: nanopulldown-colabfold-msa
# colabfold.msa.mode: server -- `colabfold_batch --msa-only` against the
# ColabFold MMseqs2 web API. Only the client is used, but colabfold_batch
# imports the AlphaFold stack, so it gets CPU jax: any platform, Mac included.
channels:
  - conda-forge
  - nodefaults
dependencies:
  - python=3.12
  - pyyaml>=6.0
  - numpy>=2.0
  - pyarrow>=15.0
  - pip
  - pip:
      - colabfold[alphafold]==1.6.3   # extra "alphafold" pulls CPU jax
