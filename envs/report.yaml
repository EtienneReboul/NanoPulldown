name: nanopulldown-report
# Report figure/table rules — domain bars, disorder curves, domain x domain
# confidence heatmaps, minimize energy traces (matplotlib), plus the
# interactive datavzrd table bundle embedded in the HTML report. datavzrd is
# also needed on PATH for the onsuccess `snakemake --report` call
# (scripts/build_report.sh), so also install it into whichever env you
# invoke `snakemake --report` from.
channels:
  - conda-forge
  - bioconda
  - nodefaults
dependencies:
  - python=3.11
  - numpy>=1.26
  - pandas>=2.0
  - pyarrow>=15.0
  - matplotlib>=3.8
  - plotly>=5.18
  - h5py>=3.10
  - pyyaml>=6.0
  - datavzrd>=2.36
