name: nanopulldown
# Controller environment — drives Snakemake orchestration for both stages.
# Per-rule compute envs are the other envs/*.yaml, built automatically via
# --use-conda. No cluster executor plugin is needed: everything here runs
# locally on one Mac.
#
# Install:
#   conda env create -f envs/controller.yaml
#   conda activate nanopulldown
channels:
  - conda-forge
  - bioconda
  - nodefaults
dependencies:
  - python=3.11
  - snakemake>=8.4
  - snakemake-wrapper-utils>=0.6
  - datavzrd>=2.36
  - pyyaml>=6.0
  - conda
  - mamba
